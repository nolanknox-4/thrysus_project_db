services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: thrysus_project_db
    # no host port mapping — `web` reaches this over the internal Docker network via
    # the "db" hostname, and the DB has no reason to be reachable from outside Docker.
    volumes:
      - db_data:/var/lib/mysql
      - ./SCHEMA.SQL:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql

volumes:
  db_data:
