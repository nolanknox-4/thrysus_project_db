# apache-security.conf — copied into the image by the Dockerfile.
# A second safety net behind .dockerignore: even if a private file does end up in the web
# folder (e.g. through the local live-edit volume), Apache refuses to serve it.

# no auto-generated folder listings (otherwise /images/ would list every file)
<Directory /var/www/html>
    Options -Indexes
</Directory>

# hidden folders and files: .git, .env, .vscode, .claude …
<DirectoryMatch "/\.">
    Require all denied
</DirectoryMatch>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# the database folder and data/config file types
<Directory /var/www/html/db>
    Require all denied
</Directory>
<FilesMatch "\.(sql|SQL|ini|yml|yaml|json|md|conf|log|sh)$">
    Require all denied
</FilesMatch>
<FilesMatch "^(Caddyfile|Dockerfile)$">
    Require all denied
</FilesMatch>
<Directory /var/www/html/ops>
    Require all denied
</Directory>

# unknown addresses get the site's own "not found" page instead of Apache's default
ErrorDocument 404 /404.php

# don't advertise exact Apache/PHP versions in headers and error pages
ServerTokens Prod
ServerSignature Off
